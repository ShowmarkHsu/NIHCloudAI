<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NICloudAI 合成 E2E Smoke</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
      main { border: 1px solid #99b8b2; border-radius: 1rem; padding: 2rem; }
      section { border-top: 1px solid #d6e3e0; margin-top: 2rem; padding-top: 1rem; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.5rem 0; }
      button, a { border: 1px solid #0f766e; border-radius: .5rem; padding: .65rem 1rem; background: #fff; color: #0f5f59; cursor: pointer; font: inherit; }
      input { box-sizing: border-box; width: 100%; max-width: 32rem; border: 1px solid #7b918d; border-radius: .5rem; padding: .65rem; font: inherit; }
      [data-nicloudai-smoke-status] { background: #eef8f6; border-radius: .5rem; padding: 1rem; }
      [data-tone] { border-left: .3rem solid #7b918d; padding: .75rem 1rem; }
      [data-tone="pass"] { border-left-color: #0f766e; background: #eef8f6; }
      [data-tone="fail"] { border-left-color: #b42318; background: #fff1f0; }
      details { margin: .5rem 0; }
      code { background: #f2f4f4; padding: .1rem .3rem; }
    </style>
  </head>
  <body>
    <main>
      <p>Local synthetic data only</p>
      <h1>NICloudAI 合成 Chrome smoke</h1>
      <p>此頁只控制擴充功能內建的合成 fixture，不包含或讀取真實病歷。</p>
      <div class="actions">
        <button type="button" data-patient="a">切換至合成病人 A</button>
        <button type="button" data-patient="b">切換至合成病人 B</button>
        <button type="button" data-clear>清除工作階段</button>
      </div>
      <p data-nicloudai-smoke-status>等待 smoke 擴充功能載入…</p>
      <p data-nicloudai-smoke-extension>載入 <code>dist-smoke</code> 後會出現擴充功能 UI 連結。</p>
      <section>
        <h2>MV3 background + 本機 Ollama</h2>
        <label for="smoke-model">已安裝的本機模型</label><br />
        <input id="smoke-model" data-smoke-model value="gemma4:e2b-it-qat" autocomplete="off" />
        <div class="actions">
          <button type="button" data-smoke-action="rules">檢查規則與來源</button>
          <button type="button" data-smoke-action="connection">測試 Ollama 連線</button>
          <button type="button" data-smoke-action="summary">產生 AI 摘要</button>
          <button type="button" data-smoke-action="cancellation">測試取消</button>
          <button type="button" data-smoke-action="error">測試錯誤狀態</button>
        </div>
        <h3>規則顯示</h3><div data-smoke-result="rules">尚未執行</div>
        <h3>Provider 連線</h3><div data-smoke-result="connection">尚未執行</div>
        <h3>AI 摘要與來源</h3><div data-smoke-result="summary">尚未執行</div>
        <h3>取消請求</h3><div data-smoke-result="cancellation">尚未執行</div>
        <h3>錯誤狀態</h3><div data-smoke-result="error">尚未執行</div>
      </section>
    </main>
  </body>
</html>
